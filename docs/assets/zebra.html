  html, body { margin: 0; }

  .frame { max-width: 860px; margin: 0 auto; padding: 16px; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }

  .head {

  }
  .head b { color: var(--fg); font-weight: 600; }
  .stats { font-variant-numeric: tabular-nums; }

  svg { display: block; width: 100%; height: auto; overflow: visible; }
  svg text { fill: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  svg .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  .axis text, .label { fill: var(--muted); font-size: 11px; }
  .axis line { stroke: var(--faint); }

  .asm { fill: var(--line); transition: fill 300ms; }
  .asm.hl { fill: var(--hl); }
  .bar { fill: var(--live); opacity: .55; }
  .bar.done { fill: var(--ok-soft); opacity: 1; transition: fill 400ms; }
  .bar.fact { fill: var(--ok); }
  .bar.hl { fill: var(--hl); }
  .playhead { stroke: var(--fg); stroke-width: 1; opacity: .35; }
  .link { fill: none; stroke: var(--hl); stroke-width: 1.2; opacity: .8; }

  .roof { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; transition: fill 600ms; }
  .body { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; transition: fill 600ms; }
  .num { font-size: 15px; font-weight: 600; }
  .cell rect { fill: var(--surface); stroke: var(--faint); stroke-width: 1; transition: fill 500ms, stroke 500ms; }
  .cell text { font-size: 13.5px; opacity: 0; transition: opacity 400ms; }
  .cell.known text { opacity: 1; }
  .cell.given text { fill: var(--muted); }
  .cell.fresh rect { fill: var(--ok-soft); stroke: var(--ok); }
  .cell.unknown text { opacity: 1; fill: var(--line); }
  .cell.answer rect { stroke: var(--hl); stroke-width: 2.5; }

  .ticker { min-height: 7.2em; margin-top: 8px; }
  .claim { margin: 0; font-weight: 600; transition: opacity 200ms; }
  .claim .tick { color: var(--ok); margin-right: 6px; }
  .claim .conf { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: 8px; }
  .from { margin: 4px 0 0; padding: 0; list-style: none; font-size: 13px; color: var(--muted); }
  .from li::before { content: "← "; color: var(--hl); }
  .from .mono { font-size: 12px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }

e": 1608, "p": "The fox is kept in a house next to house 2.", "c": 0.98, "d": [107], "a": [16]}, {"s": 1400, "e": 1606, "p": "The fox is kept in house 1 or house 3.", "c": 0.98, "d": [108, 19], "a": []}, {"s": 1417, "e": 1671, "p": "The fox is not kept in house 3.", "c": 0.97, "d": [101], "a": [5]}, {"s": 1431, "e": 1651, "p": "Houses 1, 2, 3 and 4 keep the fox, the horse, the snails and the dog respectively.", "c": 1.0, "d": [112, 33, 101, 99], "a": []}, {"s": 1431, "e": 1692, "p": "The fox is kept in house 1.", "c": 1.0, "d": [109, 110], "a": []}, {"s": 1440, "e": 1651, "p": "The zebra is not kept in house 1, 2, 3 or 4.", "c": 0.98, "d": [111], "a": [5]}, {"s": 1450, "e": 1671, "p": "The zebra is kept in house 5.", "c": 0.95, "d": [113], "a": [5, 0]}, {"s": 1466, "e": 1686, "p": "The Japanese owns the zebra.", "c": 0.98, "d": [114, 98], "a": [6]}]}</script>
<script>
(() => {
  const NS = 'http://www.w3.org/2000/svg';
  const SLOW = 20;
  const HOLD = 1300;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const theme = new URLSearchParams(location.search).get('theme');
  if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;

  const { claims, assumptions, steps } = JSON.parse(document.getElementById('data').textContent);
  const END = Math.max(...steps.map(s => s.e));
  const THEOREM = 'The Japanese owns the zebra.';

  const COLOURS = { red: 'var(--red)', green: 'var(--green)', ivory: 'var(--ivory)', yellow: 'var(--yellow)', blue: 'var(--blue)' };
  const ROWS = ['nationality', 'drink', 'smoke', 'pet'];
  const FACTS = {
    'House 1 is yellow.': ['colour', 1, 'yellow'],
    'House 2 is blue.': ['colour', 2, 'blue'],
    'House 3 is red.': ['colour', 3, 'red'],
    'House 4 is ivory.': ['colour', 4, 'ivory'],
    'House 5 is green.': ['colour', 5, 'green'],
    'The Ukrainian lives in house 2.': ['nationality', 2, 'Ukrainian'],
    'The Englishman lives in house 3.': ['nationality', 3, 'Englishman'],
    'The Spaniard lives in house 4.': ['nationality', 4, 'Spaniard'],
    'The Japanese lives in house 5.': ['nationality', 5, 'Japanese'],
    'Water is drunk in house 1.': ['drink', 1, 'water'],
    'Tea is drunk in house 2.': ['drink', 2, 'tea'],
    'Coffee is drunk in house 5.': ['drink', 5, 'coffee'],
    'Kools are smoked in house 1.': ['smoke', 1, 'Kools'],
    'Chesterfields are smoked in house 2.': ['smoke', 2, 'Chesterfields'],
    'Old Gold is smoked in house 3.': ['smoke', 3, 'Old Gold'],
    'Lucky Strike is smoked in house 4.': ['smoke', 4, 'Lucky Strike'],
    'Parliaments are smoked in house 5.': ['smoke', 5, 'Parliaments'],
    'The fox is kept in house 1.': ['pet', 1, 'fox'],
    'The horse is kept in house 2.': ['pet', 2, 'horse'],
    'Snails are kept in house 3.': ['pet', 3, 'snails'],
    'The dog is kept in house 4.': ['pet', 4, 'dog'],
    'The zebra is kept in house 5.': ['pet', 5, 'zebra'],
  };
  const GIVENS = [['nationality', 1, 'Norwegian'], ['drink', 3, 'milk']];

  // Layout
  const GX0 = 120, GX1 = 880, GY0 = 14, LANE = 10;
  const x = t => GX0 + (t / END) * (GX1 - GX0);
  const HX = i => 120 + (i - 0.5) * 152;
  const HY = 300, ROWY = 375, ROWH = 30;

  function el(tag, attrs, parent) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function text(str, attrs, parent) {
    const t = el('text', attrs, parent);
    t.textContent = str;
    return t;
  }

  const lanes = [];
  for (const s of steps) {
    let i = lanes.findIndex(end => end <= s.s);
    if (i < 0) { i = lanes.length; lanes.push(0); }
    lanes[i] = s.e;
    s.lane = i;
    s.y = GY0 + i * LANE;
  }
  const GY1 = GY0 + lanes.length * LANE;

  const gantt = document.getElementById('gantt');
  const links = document.getElementById('links');
  const houses = document.getElementById('houses');

  const axis = el('g', { class: 'axis' }, gantt);
  for (let t = 0; t <= END; t += 250) {
    el('line', { x1: x(t), x2: x(t), y1: GY0 - 6, y2: GY1 + 2 }, axis);
    text(`${(t / 1000).toFixed(2)} s`, { x: x(t), y: GY1 + 16, 'text-anchor': 'middle' }, axis);
  }
  text('assumptions', { x: 60, y: GY1 + 16, 'text-anchor': 'middle', class: 'label' }, gantt);

  const asmStep = (GY1 - GY0) / assumptions.length;
  assumptions.forEach((a, i) => {
    a.y = GY0 + 3 + i * asmStep;
    a.el = el('rect', { x: 52, y: a.y - 3, width: 16, height: 6, rx: 3, class: 'asm' }, gantt);
  });

  steps.forEach(s => {
    s.el = el('rect', { x: x(s.s), y: s.y, width: 0, height: LANE - 3, rx: (LANE - 3) / 2, class: 'bar' }, gantt);
    s.fact = FACTS[s.p] || (s.p === THEOREM ? ['theorem'] : null);
  });
  const playhead = el('line', { y1: GY0 - 8, y2: GY1 + 4, class: 'playhead' }, gantt);

  const cells = {};
  const roofs = [], bodies = [];
  text('colour', { x: 0, y: HY + 24, class: 'label' }, houses);
  ROWS.forEach((r, j) => text(r, { x: 0, y: ROWY + j * ROWH + 4, class: 'label', 'dominant-baseline': 'central' }, houses));
  for (let h = 1; h <= 5; h++) {
    const cx = HX(h);
    roofs[h] = el('path', { d: `M${cx - 62},${HY} L${cx},${HY - 26} L${cx + 62},${HY} Z`, class: 'roof' }, houses);
    bodies[h] = el('rect', { x: cx - 54, y: HY, width: 108, height: 44, class: 'body' }, houses);
    text(h, { x: cx, y: HY + 23, class: 'num', 'text-anchor': 'middle', 'dominant-baseline': 'central' }, houses);
    ROWS.forEach((r, j) => {
      const g = el('g', { class: 'cell' }, houses);
      el('rect', { x: cx - 70, y: ROWY + j * ROWH - 11, width: 140, height: ROWH - 4, rx: 6 }, g);
      const t = text('', { x: cx, y: ROWY + j * ROWH + 2, 'text-anchor': 'middle', 'dominant-baseline': 'central' }, g);
      cells[`${r}${h}`] = { g, t };
    });
  }

  function setCell(row, h, value, kind) {
    if (row === 'colour') {
      roofs[h].style.fill = COLOURS[value];
      bodies[h].style.fill = COLOURS[value];
      return;
    }
    const c = cells[`${row}${h}`];
    c.t.textContent = value;
    c.g.setAttribute('class', `cell known ${kind || ''}`);
    if (kind === 'fresh') setTimeout(() => c.g.classList.remove('fresh'), reduce ? 0 : 1200);
  }

  const claimEl = document.getElementById('claim');
  const fromEl = document.getElementById('from');
  const statsEl = document.getElementById('stats');
  document.getElementById('slow').textContent = `${SLOW}×`;

  function curve(x1, y1, x2, y2) {
    const dx = Math.max(30, Math.abs(x2 - x1) / 2);
    return `M${x1},${y1 + LANE / 2 - 1.5} C${x1 + dx},${y1 + LANE / 2 - 1.5} ${x2 - dx},${y2 + LANE / 2 - 1.5} ${x2},${y2 + LANE / 2 - 1.5}`;
  }

  let lit = [];
  function focus(s) {
    lit.forEach(e => e.classList.remove('hl'));
    links.replaceChildren();
    lit = [s.el];
    s.d.forEach(i => {
      const p = steps[i];
      lit.push(p.el);
      el('path', { d: curve(x(p.e), p.y, x(s.s), s.y), class: 'link' }, links);
    });
    s.a.forEach(i => {
      const a = assumptions[i];
      lit.push(a.el);
      el('path', { d: curve(68, a.y - LANE / 2 + 1.5, x(s.s), s.y), class: 'link' }, links);
    });
    lit.forEach(e => e.classList.add('hl'));

    claimEl.innerHTML = '';
    const tick = document.createElement('span');
    tick.className = 'tick';
    tick.textContent = '✓';
    const conf = document.createElement('span');
    conf.className = 'conf mono';
    conf.textContent = `entailed · ${s.c.toFixed(2)}`;
    claimEl.append(tick, s.p, conf);
    fromEl.replaceChildren(...s.d.map(i => li(steps[i].p)), ...s.a.map(i => li(`(assume (${assumptions[i].n}))`, true)));
  }
  function li(str, mono) {
    const e = document.createElement('li');
    if (mono) {
      const m = document.createElement('span');
      m.className = 'mono';
      m.textContent = str;
      e.append(m);
    } else e.textContent = str;
    return e;
  }

  let queue, shownAt, finished, T, last;

  function reset() {
    steps.forEach(s => { s.state = 0; s.el.setAttribute('width', 0); s.el.setAttribute('class', 'bar'); });
    lit.forEach(e => e.classList.remove('hl'));
    lit = [];
    links.replaceChildren();
    for (let h = 1; h <= 5; h++) { roofs[h].style.fill = ''; bodies[h].style.fill = ''; }
    Object.values(cells).forEach(c => { c.t.textContent = ''; c.g.setAttribute('class', 'cell'); });
    GIVENS.forEach(([r, h, v]) => setCell(r, h, v, 'given'));
    claimEl.textContent = '';
    fromEl.replaceChildren();
    queue = [];
    shownAt = -Infinity;
    finished = null;
    T = reduce ? END : -1200 / SLOW;
    last = null;
  }

  function frame(now) {
    // The clock crawls while explained facts queue up, so the ticker keeps pace with the playhead.
    if (last !== null) T = Math.min(END, T + (now - last) / SLOW * (queue.length ? 0.1 : 1));
    last = now;
    let done = 0;
    for (const s of steps) {
      if (T < s.s) continue;
      if (T >= s.e) {
        done++;
        if (s.state < 2) {
          s.state = 2;
          s.el.setAttribute('width', x(s.e) - x(s.s));
          s.el.classList.add('done');
          if (s.fact) {
            s.el.classList.add('fact');
            queue.push(s);
          }
        }
      } else {
        s.state = 1;
        s.el.setAttribute('width', Math.max(1, x(T) - x(s.s)));
      }
    }
    playhead.setAttribute('x1', x(Math.max(0, T)));
    playhead.setAttribute('x2', x(Math.max(0, T)));
    statsEl.textContent = `t = ${(Math.max(0, T) / 1000).toFixed(2)} s · ${done}/${steps.length} oracle calls${finished === null ? '' : ` · ${claims}/${claims} claims validated`}`;

    if (queue.length && (reduce || now - shownAt > HOLD)) {
      const shown = reduce ? queue.splice(0) : [queue.shift()];
      const s = shown[shown.length - 1];
      focus(s);
      shownAt = now;
      shown.forEach(f => f.fact[0] !== 'theorem' && setCell(...f.fact, reduce ? '' : 'fresh'));
      if (s.fact[0] === 'theorem') {
        cells.nationality5.g.classList.add('answer');
        cells.pet5.g.classList.add('answer');
      }
    }

    if (done === steps.length && !queue.length && finished === null) {
      finished = now;
      if (!reduce) setTimeout(() => focus(steps.find(s => s.p === THEOREM)), HOLD);
    }
    if (reduce && finished !== null) return;
    if (finished !== null && now - finished > 6000) reset();
    requestAnimationFrame(frame);
  }

  reset();
  requestAnimationFrame(frame);
})();
</script>
