<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Refresh-log keying</title>
<style>
  :root {
    --bg: #fbfaf7;
    --fg: #1d1d1f;
    --muted: #707075;
    --line: #b9b6ae;
    --surface: #ffffff;
    --name: #2f5fd0;
    --name-bg: #e9effc;
    --sense: #7a4cc2;
    --ok: #1f8a4c;
    --ok-bg: #e3f4ea;
    --neutral: #a86f00;
    --neutral-bg: #fbf1d6;
    --author: #c2410c;
    --verifier: #0e7490;
    --bad: #c2362b;
    --bad-bg: #fbe3e0;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17171a;
      --fg: #ececef;
      --muted: #9a9aa2;
      --line: #55555c;
      --surface: #222227;
      --name: #8fb0ff;
      --name-bg: #1f2a46;
      --sense: #c3a3f5;
      --ok: #5fd08f;
      --ok-bg: #173826;
      --neutral: #f0c04a;
      --neutral-bg: #3b2f12;
      --author: #fb923c;
      --verifier: #38bdd8;
      --bad: #f2786b;
      --bad-bg: #42201c;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17171a;
    --fg: #ececef;
    --muted: #9a9aa2;
    --line: #55555c;
    --surface: #222227;
    --name: #8fb0ff;
    --name-bg: #1f2a46;
    --sense: #c3a3f5;
    --ok: #5fd08f;
    --ok-bg: #173826;
    --neutral: #f0c04a;
    --neutral-bg: #3b2f12;
    --author: #fb923c;
    --verifier: #38bdd8;
    --bad: #f2786b;
    --bad-bg: #42201c;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .frame { max-width: 820px; margin: 0 auto; padding: 16px; }

  .phases {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
    gap: 6px 8px; font-size: 13px;
  }
  .phase {
    padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line);
    color: var(--muted); transition: all 300ms ease;
  }
  .phase.active { color: var(--bg); background: var(--fg); border-color: var(--fg); }
  .sep { color: var(--line); }
  .round { color: var(--muted); font-variant-numeric: tabular-nums; margin-left: 4px; }

  svg { display: block; width: 100%; height: auto; overflow: visible; }
  svg text { fill: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .mono, svg .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }

  .fade { opacity: 0; transition: opacity 500ms ease; }
  .fade.in { opacity: 1; }
  .move { transition: transform 1000ms cubic-bezier(.5, 0, .2, 1), opacity 600ms ease; }

  .lane { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
  .lane.author { fill: var(--author); }
  .lane.verifier { fill: var(--verifier); }
  .word { font-size: 16px; font-style: italic; }
  .word.author text { fill: var(--author); }
  .word.verifier text { fill: var(--verifier); }

  .chip rect { fill: var(--name-bg); stroke: var(--name); stroke-width: 1.5; }
  .chip text { fill: var(--name); font-size: 16px; font-weight: 600; }
  .pop { transform-box: fill-box; transform-origin: center; }
  .in > .pop { animation: pop 450ms cubic-bezier(.3, 1.6, .5, 1); }
  @keyframes pop { from { transform: scale(.6); } to { transform: scale(1); } }

  .edge { fill: none; stroke: var(--line); stroke-width: 2; transition: stroke-dashoffset 900ms ease, stroke 400ms ease; }
  .edge.ok { stroke: var(--ok); }
  .edge.bad { stroke: var(--bad); stroke-dasharray: 6 5; }
  .edge.neutral { stroke: var(--neutral); stroke-dasharray: 6 5; }
  .edge.gone, .chip.gone, .edge-label.gone, .flagnote.gone { opacity: 0; transition: opacity 600ms; }
  #arrow-bad path { fill: var(--bad); }
  #arrow-neutral path { fill: var(--neutral); }
  .chip.code text { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; font-weight: 500; }
  .chip.reader rect { fill: var(--surface); stroke: var(--line); }
  .chip.reader text { fill: var(--fg); font-size: 14px; font-weight: 500; }
  .chip.flag rect { stroke: var(--neutral); stroke-dasharray: 5 4; }
  .chip.bad rect { stroke: var(--bad); }
  .commit rect { fill: var(--surface); stroke: var(--sense); stroke-width: 1.5; }
  .commit text { fill: var(--sense); font-size: 12.5px; }
  .counter { font-size: 12.5px; fill: var(--muted); }
  .flagnote { font-size: 12px; fill: var(--neutral); font-style: italic; }
  .edge-label { fill: var(--sense); font-size: 14px; font-style: italic; }
  #arrow path { fill: var(--line); }
  #arrow-ok path { fill: var(--ok); }

  .claim rect { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; transition: fill 400ms, stroke 400ms; }
  .claim text { font-size: 13.5px; }
  .claim.checking rect { stroke: var(--fg); stroke-dasharray: 5 4; animation: march 600ms linear infinite; }
  .claim.ok rect { stroke: var(--ok); fill: var(--ok-bg); }
  .claim.neutral rect { stroke: var(--neutral); fill: var(--neutral-bg); }
  .claim.bad rect { stroke: var(--bad); fill: var(--bad-bg); }
  @keyframes march { to { stroke-dashoffset: -18; } }
  .badge { opacity: 0; transition: opacity 300ms; }
  .ok .badge, .neutral .badge, .bad .badge { opacity: 1; }
  .badge circle { stroke: var(--bg); stroke-width: 2; }
  .ok .badge circle { fill: var(--ok); }
  .neutral .badge circle { fill: var(--neutral); }
  .bad .badge circle { fill: var(--bad); }
  .badge text { fill: var(--bg); font-size: 13px; font-weight: 700; }

  .connector { stroke: var(--line); stroke-width: 1.5; fill: none; transition: stroke 400ms; }
  .connector.ok { stroke: var(--ok); }
  .op rect { fill: var(--bg); stroke: var(--line); stroke-width: 1.5; transition: stroke 400ms; }
  .op.ok rect { stroke: var(--ok); }
  .op text { font-size: 13px; fill: var(--muted); }
  .witness { font-size: 11.5px; fill: var(--muted); }

  .caption { min-height: 4.4em; text-align: center; transition: opacity 250ms ease; }
  .caption.out { opacity: 0; }
  .say { margin: 0; }
  .code {
    margin: 4px 0 0; font-size: 13px; color: var(--sense);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    overflow-wrap: anywhere;
  }

  .controls { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .controls button {
    flex: none; width: 34px; height: 34px; padding: 0; border-radius: 50%;
    border: 1px solid var(--line); background: var(--surface); color: var(--fg);
    display: grid; place-items: center; cursor: pointer;
  }
  .controls button:hover { border-color: var(--fg); }
  .controls button:focus-visible, .controls input:focus-visible { outline: 2px solid var(--name); outline-offset: 2px; }
  .controls svg { width: 14px; height: 14px; fill: currentColor; }
  .controls input { flex: 1; min-width: 0; accent-color: var(--fg); }
  .controls .time { flex: none; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 6.5em; text-align: right; }
  .controls .icon-play { display: none; }
  .paused .icon-play { display: block; }
  .paused .icon-pause { display: none; }

  .instant *, .instant *::before, .instant *::after { transition: none !important; animation: none !important; }
  .in.still > .pop { animation: none; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<div class="frame">
  <div class="phases" aria-hidden="true">
    <span class="phase" data-phase="0">Write the brief</span><span class="sep">→</span>
    <span class="phase" data-phase="1">Fix lands</span><span class="sep">→</span>
    <span class="phase" data-phase="2">Re-check</span><span class="sep">→</span>
    <span class="phase" data-phase="3">Update the brief</span>
    <span class="round mono" id="round"></span>
  </div>

  <svg viewBox="0 0 800 440" role="img" aria-labelledby="svg-title">
    <title id="svg-title">A brief documents that predictive blocks log BLOCK_JOB rows nobody reads. A fix lands, the same claims come back contradicted, and the updated brief validates again.</title>
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z"/>
      </marker>
      <marker id="arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z"/>
      </marker>
      <marker id="arrow-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z"/>
      </marker>
      <marker id="arrow-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z"/>
      </marker>
    </defs>
    <g id="stage"></g>
  </svg>

  <div class="caption" id="caption" aria-live="polite">
    <p class="say" id="say"></p>
    <p class="code" id="code"></p>
  </div>

  <div class="controls" id="controls">
    <button id="prev" type="button" aria-label="Previous step"><svg viewBox="0 0 16 16"><path d="M3 2h2v12H3zM14 2v12L6 8z"/></svg></button>
    <button id="play" type="button" aria-label="Play or pause">
      <svg class="icon-pause" viewBox="0 0 16 16"><path d="M3 2h4v12H3zM9 2h4v12H9z"/></svg>
      <svg class="icon-play" viewBox="0 0 16 16"><path d="M4 2l10 6-10 6z"/></svg>
    </button>
    <button id="next" type="button" aria-label="Next step"><svg viewBox="0 0 16 16"><path d="M11 2h2v12h-2zM2 2v12l8-6z"/></svg></button>
    <input id="scrub" type="range" min="0" step="10" value="0" aria-label="Position in the animation">
    <span class="time" id="time"></span>
  </div>
</div>

<script>
(() => {
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const theme = new URLSearchParams(location.search).get('theme');
  if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;

  const stage = document.getElementById('stage');
  const captionEl = document.getElementById('caption');
  const sayEl = document.getElementById('say');
  const codeEl = document.getElementById('code');
  const roundEl = document.getElementById('round');
  const phaseEls = [...document.querySelectorAll('.phase')];
  let edges, claims, chips, counter;

  // The script runs on a virtual clock so that any moment can be reconstructed by replaying
  // it from the start with transitions switched off.
  let vt = 0, timers = [], seq = 0, seeking = false;
  const sleep = ms => new Promise(resolve => timers.push({ at: vt + ms, seq: seq++, resolve }));


  function el(tag, attrs, parent) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    parent.appendChild(e);
    return e;
  }

  function label(str, x, y, cls, parent) {
    const t = el('text', { x, y, class: cls || '', 'text-anchor': 'middle', 'dominant-baseline': 'central' }, parent);
    t.textContent = str;
    return t;
  }

  function place(g, x, y) { g.style.transform = `translate(${x}px, ${y}px)`; }

  function show(e) {
    e.getBoundingClientRect();
    e.classList.add('in');
    if (seeking) e.classList.add('still');
  }

  function box(parent, str, cls, padX, h) {
    const g = el('g', { class: 'pop' }, parent);
    const r = el('rect', {}, g);
    const t = label(str, 0, 0, cls, g);
    const w = t.getComputedTextLength() + padX * 2;
    Object.entries({ x: -w / 2, y: -h / 2, width: w, height: h, rx: h / 2 }).forEach(([k, v]) => r.setAttribute(k, v));
    return w;
  }

  async function caption(say, code = '') {
    captionTimes.push(vt);
    await sleep(1);
    captionEl.classList.add('out');
    await sleep(250);
    sayEl.textContent = say;
    codeEl.textContent = code;
    captionEl.classList.remove('out');
  }

  function phase(i, head) {
    phaseEls.forEach((p, j) => p.classList.toggle('active', i === j));
    roundEl.textContent = `HEAD ${head}`;
  }

  function chip(name, x, y, cls = 'code') {
    const g = el('g', { class: `chip ${cls} fade` }, chips);
    place(g, x, y);
    box(g, name, '', 14, 32);
    show(g);
    return g;
  }

  function fadeOut(e) { e.classList.add('gone'); }

  async function edge(d, text, lx, ly) {
    const p = el('path', { d, class: 'edge' }, edges);
    const len = p.getTotalLength();
    p.style.strokeDasharray = len;
    p.style.strokeDashoffset = len;
    p.getBoundingClientRect();
    p.style.strokeDashoffset = 0;
    await sleep(900);
    p.style.strokeDasharray = '';
    p.style.strokeDashoffset = '';
    p.setAttribute('marker-end', 'url(#arrow)');
    p.label = label(text, lx, ly, 'edge-label fade', edges);
    show(p.label);
    return p;
  }

  function mark(p, state) {
    p.classList.remove('ok', 'bad', 'neutral');
    if (state) p.classList.add(state);
    p.setAttribute('marker-end', state ? `url(#arrow-${state})` : 'url(#arrow)');
  }

  function claim(str, x, y) {
    const g = el('g', { class: 'claim fade' }, claims);
    place(g, x, y);
    retext(g, str);
    show(g);
    return g;
  }

  function retext(g, str) {
    g.replaceChildren();
    g.classList.remove('ok', 'neutral', 'bad');
    const w = box(g, str, '', 18, 30);
    const b = el('g', { class: 'badge' }, g);
    place(b, w / 2, -15);
    el('circle', { r: 11 }, b);
    g.glyph = label('', 0, 1, '', b);
  }

  const GLYPH = { ok: '✓', neutral: '?', bad: '✗' };

  async function check(g, result) {
    g.classList.remove('ok', 'neutral', 'bad');
    g.classList.add('checking');
    await sleep(1300);
    g.classList.remove('checking');
    g.glyph.textContent = GLYPH[result];
    g.classList.add(result);
  }

  function count(str) { counter.textContent = str; }

  async function run() {
    stage.replaceChildren();
    edges = el('g', {}, stage);
    claims = el('g', {}, stage);
    chips = el('g', {}, stage);
    label('brief', 40, 264, 'counter', claims).setAttribute('text-anchor', 'start');
    counter = label('', 760, 264, 'counter mono', claims);
    counter.setAttribute('text-anchor', 'end');

    phase(0, '485f86109');
    await caption('A logic block logs its transaction to the refresh log.', '(sense logs_entry "{procedure} inserts {entry} rows into the refresh log")');
    chip('_INTERNAL_RUN_LQP_BLOCK', 150, 110);
    await sleep(400);
    chip('BLOCK_TXN', 410, 110);
    await sleep(300);
    await edge('M258,110 L355,110', 'logs', 306, 94);
    await sleep(600);
    await caption('Its rows are keyed to the refresh run.', '(sense stamped_from "{entry} rows get their run_start_time from {source}")');
    chip('RUN_START_TIME', 660, 110);
    await sleep(300);
    await edge('M463,110 L587,110', 'stamped from', 525, 94);
    await sleep(600);
    await caption('The debugger and the doctor report read those rows.');
    chip('debugger, doctor report', 410, 32, 'reader');
    await sleep(300);
    await edge('M410,50 L410,90', 'read', 438, 70);
    await sleep(1200);

    await caption('A predictive block logs its job id differently.', '(logs_entry _INTERNAL_RUN_PREDICTIVE_BLOCK BLOCK_JOB)');
    const pred = chip('_INTERNAL_RUN_PREDICTIVE_BLOCK', 150, 200);
    await sleep(400);
    const job = chip('BLOCK_JOB', 410, 200);
    await sleep(300);
    const logsJob = await edge('M285,200 L355,200', 'logs', 320, 184);
    await sleep(500);
    await caption('Its rows are stamped with the time of the insert.', '(stamped_from BLOCK_JOB CURRENT_TIMESTAMP)');
    const now = chip('CURRENT_TIMESTAMP', 660, 200);
    await sleep(300);
    const stamped = await edge('M463,200 L575,200', 'stamped from', 519, 184);
    await sleep(1400);

    await caption('The brief states this as claims, each witnessed by the code.');
    const cTxn = claim('BLOCK_TXN rows get their run_start_time from RUN_START_TIME', 400, 298);
    const cArgs = claim('_INTERNAL_RUN_PREDICTIVE_BLOCK takes six arguments', 400, 338);
    const cLogs = claim('_INTERNAL_RUN_PREDICTIVE_BLOCK inserts BLOCK_JOB rows into the refresh log', 400, 378);
    const cStamp = claim('BLOCK_JOB rows get their run_start_time from CURRENT_TIMESTAMP', 400, 418);
    await sleep(800);
    await caption('All of them check out.');
    for (const c of [cTxn, cArgs, cLogs, cStamp]) { check(c, 'ok'); await sleep(250); }
    await sleep(1300);
    count('24/24 claims validated');
    await sleep(1400);
    await caption('Side by side, the brief shows the divergence: nothing reads BLOCK_JOB rows.');
    job.classList.add('flag');
    const note = label('read by nothing', 410, 232, 'flagnote fade', chips);
    show(note);
    await sleep(3000);

    phase(1, '9eec0c217');
    await caption('A fix lands.', 'Key a predictive block\'s refresh-log rows to the refresh run');
    const commit = el('g', { class: 'commit fade' }, chips);
    place(commit, 150, 234);
    box(commit, 'commit 9eec0c217', 'mono', 12, 24);
    show(commit);
    await sleep(2200);
    await caption('The procedure now takes the schedule name and run start time, and logs a BLOCK_TXN row.');
    await sleep(2800);
    await caption('Nobody touched the brief.');
    await sleep(1800);

    phase(2, '9eec0c217');
    await caption('Checking the same brief against the new code…', 'autoground check predictive-deploy-brief.md');
    commit.classList.remove('in');
    for (const c of [cTxn, cArgs, cLogs, cStamp]) c.classList.add('checking');
    check(cTxn, 'ok');
    check(cArgs, 'bad');
    check(cLogs, 'neutral');
    await check(cStamp, 'bad');
    pred.classList.add('bad');
    mark(logsJob, 'neutral');
    mark(stamped, 'bad');
    count('20/24 claims validated');
    await caption('Two claims are contradicted outright: the code now says otherwise.');
    await sleep(2600);
    await caption('A third is no longer supported: nothing in the code shows it any more.');
    await sleep(2600);

    phase(3, '9eec0c217');
    await caption('The brief follows the code.');
    retext(cArgs, '_INTERNAL_RUN_PREDICTIVE_BLOCK takes eight arguments, now including the schedule name and run start time');
    pred.classList.remove('bad');
    await sleep(1000);
    await caption('The predictive block now logs BLOCK_TXN rows, like the logic block.', '(logs_entry _INTERNAL_RUN_PREDICTIVE_BLOCK BLOCK_TXN)');
    retext(cLogs, '_INTERNAL_RUN_PREDICTIVE_BLOCK inserts BLOCK_TXN rows into the refresh log');
    [logsJob, logsJob.label, stamped, stamped.label, job, now, note].forEach(fadeOut);
    await sleep(700);
    const logsTxn = await edge('M285,190 L362,124', 'logs', 300, 148);
    await sleep(800);
    await caption('BLOCK_JOB and CURRENT_TIMESTAMP leave the brief; the doctor report’s filter takes their place.');
    retext(cStamp, 'The doctor report reads only BLOCK_TXN rows that carry a txn_id, so it skips predictive job ids');
    await sleep(1600);

    await caption('Checking again…', 'autoground check predictive-deploy-brief.md');
    for (const c of [cTxn, cArgs, cLogs, cStamp]) { check(c, 'ok'); await sleep(250); }
    await sleep(1300);
    mark(logsTxn, 'ok');
    count('23/23 claims validated');
    await caption('The brief validates again, now describing the fix.', 'autoground check  ✓  23/23');
    await sleep(4000);
  }

  const root = document.documentElement;
  const controls = document.getElementById('controls');
  const scrub = document.getElementById('scrub');
  const timeEl = document.getElementById('time');
  let captionTimes = [], stops = [], END = 0;
  let playing = !reduce, playTarget = 0, wanted = null, dest = 0, busy = false, last = null;

  const macrotask = () => new Promise(r => {
    const c = new MessageChannel();
    c.port1.onmessage = () => r();
    c.port2.postMessage(0);
  });

  function restart() {
    timers = [];
    vt = 0;
    captionTimes = [];
    sayEl.textContent = '';
    codeEl.textContent = '';
    run();
  }

  async function advance(target) {
    for (;;) {
      timers.sort((a, b) => a.at - b.at || a.seq - b.seq);
      const t = timers[0];
      if (!t || t.at > target) break;
      timers.shift();
      vt = t.at;
      t.resolve();
      await macrotask();
    }
    if (target !== Infinity) vt = target;
  }

  async function seek(t) {
    seeking = true;
    root.classList.add('instant');
    if (t < vt) restart();
    await advance(t);
    stage.getBoundingClientRect();
    root.classList.remove('instant');
    seeking = false;
    playTarget = vt;
  }

  async function pump() {
    if (busy) return;
    busy = true;
    while (wanted !== null) {
      const t = wanted;
      wanted = null;
      await seek(t);
    }
    if (playing && playTarget > vt) await advance(playTarget);
    busy = false;
  }

  function goto(t) {
    wanted = dest = Math.max(0, Math.min(END, t));
    playTarget = wanted;
    pump();
  }

  function setPlaying(p) {
    playing = p;
    controls.classList.toggle('paused', !p);
  }

  // While a seek replays the script, vt runs through earlier moments; report where it is headed.
  function now_() { return seeking || wanted !== null ? dest : vt; }

  function fmt(ms) { return `${(ms / 1000).toFixed(1)} / ${(END / 1000).toFixed(1)} s`; }

  function frame(now) {
    if (playing && last !== null) {
      playTarget = Math.min(END, playTarget + (now - last));
      if (vt >= END && !busy) goto(0);
      else pump();
    }
    last = now;
    const at = now_();
    if (!scrub.matches(':active')) scrub.value = at;
    timeEl.textContent = fmt(at);
    requestAnimationFrame(frame);
  }

  function step(dir) {
    setPlaying(false);
    const at = now_();
    const t = dir > 0 ? stops.find(s => s > at + 1) : [...stops].reverse().find(s => s < at - 1);
    goto(t ?? (dir > 0 ? END : 0));
  }

  scrub.addEventListener('input', () => { setPlaying(false); goto(+scrub.value); });
  document.getElementById('play').addEventListener('click', () => {
    if (!playing && vt >= END) goto(0);
    setPlaying(!playing);
  });
  document.getElementById('prev').addEventListener('click', () => step(-1));
  document.getElementById('next').addEventListener('click', () => step(1));
  document.addEventListener('keydown', e => {
    if (e.target.closest('button') && (e.key === ' ' || e.key === 'Enter')) return;
    if (e.key === ' ') { e.preventDefault(); setPlaying(!playing); }
    else if (e.key === 'ArrowRight' && e.target !== scrub) step(1);
    else if (e.key === 'ArrowLeft' && e.target !== scrub) step(-1);
  });

  async function init() {
    // A dry run measures the script and finds where each step ends: when the next caption
    // is requested, a millisecond before it starts to fade out.
    root.classList.add('instant');
    seeking = true;
    restart();
    await advance(Infinity);
    END = vt;
    stops = [...captionTimes.slice(1), END];
    scrub.max = END;
    seeking = false;
    root.classList.remove('instant');
    setPlaying(playing);
    if (reduce) goto(END);
    else { vt = Infinity; goto(0); }
    requestAnimationFrame(frame);
  }

  (document.fonts ? document.fonts.ready : Promise.resolve()).then(init);
})();
</script>
</body>
</html>
