<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zebra decomposition</title>
<style>
  :root {
    --bg: #fbfaf7;
    --fg: #1d1d1f;
    --muted: #707075;
    --line: #b9b6ae;
    --surface: #ffffff;
    --name: #2f5fd0;
    --name-bg: #e9effc;
    --sense: #7a4cc2;
    --ok: #1f8a4c;
    --ok-bg: #e3f4ea;
    --neutral: #a86f00;
    --neutral-bg: #fbf1d6;
    --author: #c2410c;
    --verifier: #0e7490;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17171a;
      --fg: #ececef;
      --muted: #9a9aa2;
      --line: #55555c;
      --surface: #222227;
      --name: #8fb0ff;
      --name-bg: #1f2a46;
      --sense: #c3a3f5;
      --ok: #5fd08f;
      --ok-bg: #173826;
      --neutral: #f0c04a;
      --neutral-bg: #3b2f12;
      --author: #fb923c;
      --verifier: #38bdd8;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17171a;
    --fg: #ececef;
    --muted: #9a9aa2;
    --line: #55555c;
    --surface: #222227;
    --name: #8fb0ff;
    --name-bg: #1f2a46;
    --sense: #c3a3f5;
    --ok: #5fd08f;
    --ok-bg: #173826;
    --neutral: #f0c04a;
    --neutral-bg: #3b2f12;
    --author: #fb923c;
    --verifier: #38bdd8;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .frame { max-width: 820px; margin: 0 auto; padding: 16px; }

  .phases {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
    gap: 6px 8px; font-size: 13px;
  }
  .phase {
    padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line);
    color: var(--muted); transition: all 300ms ease;
  }
  .phase.active { color: var(--bg); background: var(--fg); border-color: var(--fg); }
  .sep { color: var(--line); }
  .round { color: var(--muted); font-variant-numeric: tabular-nums; margin-left: 4px; }

  svg { display: block; width: 100%; height: auto; overflow: visible; }
  svg text { fill: var(--fg); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .mono, svg .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }

  .fade { opacity: 0; transition: opacity 500ms ease; }
  .fade.in { opacity: 1; }
  .move { transition: transform 1000ms cubic-bezier(.5, 0, .2, 1), opacity 600ms ease; }

  .lane { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
  .lane.author { fill: var(--author); }
  .lane.verifier { fill: var(--verifier); }
  .word { font-size: 16px; font-style: italic; }
  .word.author text { fill: var(--author); }
  .word.verifier text { fill: var(--verifier); }

  .chip rect { fill: var(--name-bg); stroke: var(--name); stroke-width: 1.5; }
  .chip text { fill: var(--name); font-size: 16px; font-weight: 600; }
  .pop { transform-box: fill-box; transform-origin: center; }
  .in > .pop { animation: pop 450ms cubic-bezier(.3, 1.6, .5, 1); }
  @keyframes pop { from { transform: scale(.6); } to { transform: scale(1); } }

  .edge { fill: none; stroke: var(--line); stroke-width: 2; transition: stroke-dashoffset 900ms ease, stroke 400ms ease; }
  .edge.ok { stroke: var(--ok); }
  .edge-label { fill: var(--sense); font-size: 14px; font-style: italic; }
  #arrow path { fill: var(--line); }
  #arrow-ok path { fill: var(--ok); }

  .claim rect { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; transition: fill 400ms, stroke 400ms; }
  .claim text { font-size: 14px; }
  .claim.checking rect { stroke: var(--fg); stroke-dasharray: 5 4; animation: march 600ms linear infinite; }
  .claim.ok rect { stroke: var(--ok); fill: var(--ok-bg); }
  .claim.neutral rect { stroke: var(--neutral); fill: var(--neutral-bg); }
  @keyframes march { to { stroke-dashoffset: -18; } }
  .badge { opacity: 0; transition: opacity 300ms; }
  .ok .badge, .neutral .badge { opacity: 1; }
  .badge circle { stroke: var(--bg); stroke-width: 2; }
  .ok .badge circle { fill: var(--ok); }
  .neutral .badge circle { fill: var(--neutral); }
  .badge text { fill: var(--bg); font-size: 13px; font-weight: 700; }

  .connector { stroke: var(--line); stroke-width: 1.5; fill: none; transition: stroke 400ms; }
  .connector.ok { stroke: var(--ok); }
  .op rect { fill: var(--bg); stroke: var(--line); stroke-width: 1.5; transition: stroke 400ms; }
  .op.ok rect { stroke: var(--ok); }
  .op text { font-size: 13px; fill: var(--muted); }
  .tag { font-size: 11.5px; fill: var(--muted); }
  .clue { font-size: 15px; fill: var(--muted); font-style: italic; }
  .edge.claimed { stroke-dasharray: 6 5; }
  .edge.claimed.ok { stroke-dasharray: none; }
  .doubt { font-size: 22px; font-weight: 700; fill: var(--neutral); }

  .caption { min-height: 4.4em; text-align: center; transition: opacity 250ms ease; }
  .caption.out { opacity: 0; }
  .say { margin: 0; }
  .code {
    margin: 4px 0 0; font-size: 13px; color: var(--sense);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    overflow-wrap: anywhere;
  }

  .controls { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .controls button {
    flex: none; width: 34px; height: 34px; padding: 0; border-radius: 50%;
    border: 1px solid var(--line); background: var(--surface); color: var(--fg);
    display: grid; place-items: center; cursor: pointer;
  }
  .controls button:hover { border-color: var(--fg); }
  .controls button:focus-visible, .controls input:focus-visible { outline: 2px solid var(--name); outline-offset: 2px; }
  .controls svg { width: 14px; height: 14px; fill: currentColor; }
  .controls input { flex: 1; min-width: 0; accent-color: var(--fg); }
  .controls .time { flex: none; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 6.5em; text-align: right; }
  .controls .icon-play { display: none; }
  .paused .icon-play { display: block; }
  .paused .icon-pause { display: none; }

  .instant *, .instant *::before, .instant *::after { transition: none !important; animation: none !important; }
  .in.still > .pop { animation: none; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<div class="frame">
  <div class="phases" aria-hidden="true">
    <span class="phase" data-phase="0">Align terms</span><span class="sep">→</span>
    <span class="phase" data-phase="1">Relate names</span><span class="sep">→</span>
    <span class="phase" data-phase="2">Decompose claims</span>
    <span class="round" id="round"></span>
  </div>

  <svg viewBox="0 0 800 500" role="img" aria-labelledby="svg-title">
    <title id="svg-title">The claim that the Spaniard does not smoke Old Gold stays neutral until the brief states that the dog and the snails are different pets; then every step checks out.</title>
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z"/>
      </marker>
      <marker id="arrow-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z"/>
      </marker>
    </defs>
    <g id="stage"></g>
  </svg>

  <div class="caption" id="caption" aria-live="polite">
    <p class="say" id="say"></p>
    <p class="code" id="code"></p>
  </div>

  <div class="controls" id="controls">
    <button id="prev" type="button" aria-label="Previous step"><svg viewBox="0 0 16 16"><path d="M3 2h2v12H3zM14 2v12L6 8z"/></svg></button>
    <button id="play" type="button" aria-label="Play or pause">
      <svg class="icon-pause" viewBox="0 0 16 16"><path d="M3 2h4v12H3zM9 2h4v12H9z"/></svg>
      <svg class="icon-play" viewBox="0 0 16 16"><path d="M4 2l10 6-10 6z"/></svg>
    </button>
    <button id="next" type="button" aria-label="Next step"><svg viewBox="0 0 16 16"><path d="M11 2h2v12h-2zM2 2v12l8-6z"/></svg></button>
    <input id="scrub" type="range" min="0" step="10" value="0" aria-label="Position in the animation">
    <span class="time" id="time"></span>
  </div>
</div>

<script>
(() => {
  const NS = 'http://www.w3.org/2000/svg';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const theme = new URLSearchParams(location.search).get('theme');
  if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;

  const stage = document.getElementById('stage');
  const captionEl = document.getElementById('caption');
  const sayEl = document.getElementById('say');
  const codeEl = document.getElementById('code');
  const roundEl = document.getElementById('round');
  const phaseEls = [...document.querySelectorAll('.phase')];
  let edges, claims, chips, words;

  // The script runs on a virtual clock so that any moment can be reconstructed by replaying
  // it from the start with transitions switched off.
  let vt = 0, timers = [], seq = 0, seeking = false;
  const sleep = ms => new Promise(resolve => timers.push({ at: vt + ms, seq: seq++, resolve }));

  function el(tag, attrs, parent) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    parent.appendChild(e);
    return e;
  }

  function label(str, x, y, cls, parent) {
    const t = el('text', { x, y, class: cls || '', 'text-anchor': 'middle', 'dominant-baseline': 'central' }, parent);
    t.textContent = str;
    return t;
  }

  function place(g, x, y) { g.style.transform = `translate(${x}px, ${y}px)`; }

  function show(e) {
    e.getBoundingClientRect();
    e.classList.add('in');
    if (seeking) e.classList.add('still');
  }

  function box(parent, str, cls, padX, h) {
    const g = el('g', { class: 'pop' }, parent);
    const r = el('rect', {}, g);
    const t = label(str, 0, 0, cls, g);
    const w = t.getComputedTextLength() + padX * 2;
    Object.entries({ x: -w / 2, y: -h / 2, width: w, height: h, rx: h / 2 }).forEach(([k, v]) => r.setAttribute(k, v));
    return w;
  }

  async function caption(say, code = '') {
    captionTimes.push(vt);
    await sleep(1);
    captionEl.classList.add('out');
    await sleep(250);
    sayEl.textContent = say;
    codeEl.textContent = code;
    captionEl.classList.remove('out');
  }

  function phase(i, round) {
    phaseEls.forEach((p, j) => p.classList.toggle('active', i === j));
    roundEl.textContent = `↺ round ${round}`;
  }

  function chip(name, x, y) {
    const g = el('g', { class: 'chip fade' }, chips);
    place(g, x, y);
    box(g, name, '', 14, 34);
    show(g);
    return g;
  }

  async function clue(sentence, names) {
    const t = label(sentence, 400, 50, 'clue fade', words);
    show(t);
    await sleep(1400);
    const flying = names.map(([n]) => {
      const w = el('g', { class: 'word fade move' }, words);
      place(w, 400, 50);
      label(n, 0, 0, '', w);
      show(w);
      return w;
    });
    await sleep(100);
    names.forEach(([, [x, y]], i) => place(flying[i], x, y));
    await sleep(1000);
    names.forEach(([n, [x, y]]) => chip(n, x, y));
    flying.forEach(w => w.remove());
    t.classList.remove('in');
    await sleep(500);
    t.remove();
  }

  function connect(d) {
    const c = el('path', { d, class: 'connector fade' }, claims);
    show(c);
    return c;
  }

  function op(x, y) {
    const g = el('g', { class: 'op fade' }, claims);
    place(g, x, y);
    box(g, 'and', 'mono', 12, 24);
    show(g);
    return g;
  }

  function tag(str, x, y) {
    show(label(str, x, y, 'tag mono fade', claims));
  }

  async function edge(d, text, lx, ly) {
    const p = el('path', { d, class: 'edge' }, edges);
    const len = p.getTotalLength();
    p.style.strokeDasharray = len;
    p.style.strokeDashoffset = len;
    p.getBoundingClientRect();
    p.style.strokeDashoffset = 0;
    await sleep(900);
    p.style.strokeDasharray = '';
    p.style.strokeDashoffset = '';
    p.setAttribute('marker-end', 'url(#arrow)');
    const t = label(text, lx, ly, 'edge-label fade', edges);
    show(t);
    return p;
  }

  function settle(p) {
    p.classList.add('ok');
    if (p.hasAttribute('marker-end')) p.setAttribute('marker-end', 'url(#arrow-ok)');
  }

  function claim(str, x, y) {
    const g = el('g', { class: 'claim fade' }, claims);
    place(g, x, y);
    const w = box(g, str, '', 18, 32);
    const b = el('g', { class: 'badge' }, g);
    place(b, w / 2, -16);
    el('circle', { r: 11 }, b);
    g.glyph = label('', 0, 1, '', b);
    show(g);
    return g;
  }

  async function check(g, result) {
    g.classList.remove('ok', 'neutral');
    g.classList.add('checking');
    await sleep(1300);
    g.classList.remove('checking');
    g.glyph.textContent = result === 'ok' ? '✓' : '?';
    g.classList.add(result);
  }

  async function run() {
    stage.replaceChildren();
    edges = el('g', {}, stage);
    claims = el('g', {}, stage);
    chips = el('g', {}, stage);
    words = el('g', {}, stage);

    phase(0, 1);
    await caption('Two of the clues introduce four names.');
    await clue('“The Spaniard owns the dog.”', [['Spaniard', [190, 115]], ['dog', [190, 205]]]);
    await clue('“The Old Gold smoker owns snails.”', [['Old Gold', [610, 115]], ['snails', [610, 205]]]);
    await caption('The clues become assumptions of the brief.', '(assume (c-spaniard-dog))  (assume (c-oldgold-snails))');
    await sleep(2000);

    phase(1, 1);
    await caption('Each clue relates two of the names.');
    const owns = await edge('M190,133 L190,186', 'owns', 158, 160);
    await sleep(500);
    const smokerOwns = await edge('M610,133 L610,186', 'smoker owns', 666, 160);
    await sleep(1200);
    await caption('The step to prove relates two names that no clue connects.', '"The Spaniard does not smoke Old Gold."');
    const claimed = await edge('M246,115 L548,115', 'does not smoke', 400, 99);
    claimed.classList.add('claimed');
    await sleep(2000);

    phase(2, 1);
    const top = claim('The Spaniard does not smoke Old Gold.', 400, 285);
    await sleep(600);
    await caption('It breaks down into two smaller claims.', '(and ("The Spaniard does not own snails.") (c-oldgold-snails))');
    const c1 = [connect('M400,301 L400,308'), connect('M400,332 C400,344 220,334 220,346'), connect('M400,332 C400,344 580,334 580,346')];
    const and1 = op(400, 320);
    await sleep(400);
    const left = claim('The Spaniard does not own snails.', 220, 362);
    const right = claim('The Old Gold smoker owns snails.', 580, 362);
    await sleep(1000);
    await caption('The second claim is a clue, so it holds by assumption.');
    tag('(assume (c-oldgold-snails))', 580, 394);
    right.glyph.textContent = '✓';
    right.classList.add('ok');
    await sleep(1600);
    await caption('The first one rests on the dog clue and the rule that each house keeps one pet…', '(and (c-spaniard-dog) (u-pet) (frame-same-house))');
    await check(left, 'neutral');
    top.glyph.textContent = '?';
    top.classList.add('neutral');
    await caption('…yet the oracle won’t take the step, even though every premise holds.');
    await sleep(2600);

    phase(0, 2);
    await caption('The oracle doesn’t know that the dog and the snails are different pets.');
    const doubt = label('?', 400, 205, 'doubt fade', edges);
    show(doubt);
    await sleep(2200);
    await caption('The brief already lists the five pets; the step has to cite that list.', '(sense frame-pets "The pets are exactly dog, snails, fox, horse and zebra.")');
    await sleep(2600);

    phase(1, 2);
    doubt.classList.remove('in');
    await caption('That relates the dog and the snails.', '"The dog and the snails are different pets."');
    const different = await edge('M222,205 L578,205', 'different pets', 400, 189);
    different.removeAttribute('marker-end');
    await sleep(2000);

    phase(2, 2);
    await caption('The stuck claim gets a premise that says so.', '(claim ("The dog and the snails are different pets.") (frame-pets))');
    left.classList.remove('neutral');
    top.classList.remove('neutral');
    const c2 = [
      connect('M220,378 L220,386'),
      connect('M220,410 C220,424 110,412 110,428'),
      connect('M220,410 C220,424 340,412 340,428'),
      connect('M220,410 C220,426 610,410 610,428'),
    ];
    const and2 = op(220, 398);
    await sleep(400);
    const g1 = claim('The Spaniard owns the dog.', 110, 444);
    const g2 = claim('Each house keeps one pet.', 340, 444);
    const g3 = claim('The dog and the snails are different pets.', 610, 444);
    await sleep(1200);
    await caption('Two premises are assumptions; the third follows from the list of pets.');
    tag('(assume (c-spaniard-dog))', 110, 476);
    tag('(assume (u-pet))', 340, 476);
    tag('← (frame-pets)', 610, 476);
    for (const g of [g1, g2]) { g.glyph.textContent = '✓'; g.classList.add('ok'); }
    await check(g3, 'ok');
    settle(different);
    await sleep(400);
    c2.slice(1).forEach(c => c.classList.add('ok'));
    and2.classList.add('ok');
    c2[0].classList.add('ok');
    await caption('With all three premises in hand, the oracle accepts the step.');
    await check(left, 'ok');
    settle(owns);
    settle(smokerOwns);
    await sleep(400);
    c1.forEach(c => c.classList.add('ok'));
    and1.classList.add('ok');
    await check(top, 'ok');
    settle(claimed);
    await caption('The Spaniard does not smoke Old Gold.', 'autoground check  ✓');
    await sleep(4000);
  }

  const root = document.documentElement;
  const controls = document.getElementById('controls');
  const scrub = document.getElementById('scrub');
  const timeEl = document.getElementById('time');
  let captionTimes = [], stops = [], END = 0;
  let playing = !reduce, playTarget = 0, wanted = null, dest = 0, busy = false, last = null;

  const macrotask = () => new Promise(r => {
    const c = new MessageChannel();
    c.port1.onmessage = () => r();
    c.port2.postMessage(0);
  });

  function restart() {
    timers = [];
    vt = 0;
    captionTimes = [];
    sayEl.textContent = '';
    codeEl.textContent = '';
    run();
  }

  async function advance(target) {
    for (;;) {
      timers.sort((a, b) => a.at - b.at || a.seq - b.seq);
      const t = timers[0];
      if (!t || t.at > target) break;
      timers.shift();
      vt = t.at;
      t.resolve();
      await macrotask();
    }
    if (target !== Infinity) vt = target;
  }

  async function seek(t) {
    seeking = true;
    root.classList.add('instant');
    if (t < vt) restart();
    await advance(t);
    stage.getBoundingClientRect();
    root.classList.remove('instant');
    seeking = false;
    playTarget = vt;
  }

  async function pump() {
    if (busy) return;
    busy = true;
    while (wanted !== null) {
      const t = wanted;
      wanted = null;
      await seek(t);
    }
    if (playing && playTarget > vt) await advance(playTarget);
    busy = false;
  }

  function goto(t) {
    wanted = dest = Math.max(0, Math.min(END, t));
    playTarget = wanted;
    pump();
  }

  function setPlaying(p) {
    playing = p;
    controls.classList.toggle('paused', !p);
  }

  // While a seek replays the script, vt runs through earlier moments; report where it is headed.
  function now_() { return seeking || wanted !== null ? dest : vt; }

  function fmt(ms) { return `${(ms / 1000).toFixed(1)} / ${(END / 1000).toFixed(1)} s`; }

  function frame(now) {
    if (playing && last !== null) {
      playTarget = Math.min(END, playTarget + (now - last));
      if (vt >= END && !busy) goto(0);
      else pump();
    }
    last = now;
    const at = now_();
    if (!scrub.matches(':active')) scrub.value = at;
    timeEl.textContent = fmt(at);
    requestAnimationFrame(frame);
  }

  function step(dir) {
    setPlaying(false);
    const at = now_();
    const t = dir > 0 ? stops.find(s => s > at + 1) : [...stops].reverse().find(s => s < at - 1);
    goto(t ?? (dir > 0 ? END : 0));
  }

  scrub.addEventListener('input', () => { setPlaying(false); goto(+scrub.value); });
  document.getElementById('play').addEventListener('click', () => {
    if (!playing && vt >= END) goto(0);
    setPlaying(!playing);
  });
  document.getElementById('prev').addEventListener('click', () => step(-1));
  document.getElementById('next').addEventListener('click', () => step(1));
  document.addEventListener('keydown', e => {
    if (e.target.closest('button') && (e.key === ' ' || e.key === 'Enter')) return;
    if (e.key === ' ') { e.preventDefault(); setPlaying(!playing); }
    else if (e.key === 'ArrowRight' && e.target !== scrub) step(1);
    else if (e.key === 'ArrowLeft' && e.target !== scrub) step(-1);
  });

  async function init() {
    // A dry run measures the script and finds where each step ends: when the next caption
    // is requested, a millisecond before it starts to fade out.
    root.classList.add('instant');
    seeking = true;
    restart();
    await advance(Infinity);
    END = vt;
    stops = [...captionTimes.slice(1), END];
    scrub.max = END;
    seeking = false;
    root.classList.remove('instant');
    setPlaying(playing);
    if (reduce) goto(END);
    else { vt = Infinity; goto(0); }
    requestAnimationFrame(frame);
  }

  (document.fonts ? document.fonts.ready : Promise.resolve()).then(init);
})();
</script>
</body>
</html>
