[package]
name = "autoground"
version = "0.1.0"
edition = "2021"
description = "Compile and run self-grounding conceptual models of a codebase"
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "2.12", features = ["json"] }

[[bin]]
name = "search-eval"
path = "evals/search/main.rs"

[[bin]]
name = "read-eval"
path = "evals/read/main.rs"
