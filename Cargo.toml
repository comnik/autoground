[package]
name = "autoground"
version = "0.2.0"
edition = "2021"
description = "Establish and maintain an accurate mental model of a codebase."
license = "MIT"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
ignore = "0.4"
sebastian = { version = "0.8", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "2.12", features = ["json"] }
