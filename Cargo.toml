[package]
name = "autoground"
version = "0.3.0"
edition = "2021"
description = "Establish and maintain an accurate mental model of a codebase."
license = "MIT"

[dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.28"
ignore = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
ureq = { version = "2.12", features = ["json"] }
