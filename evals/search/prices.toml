# Pinned 2026-09-22 from https://docs.x.ai/docs/models
# Short-context band: a prompt under 200k tokens. Session totals are not split
# per request, so this estimate uses that band for every token.
# cached_input prices cache_read. cache_creation has no published rate.
# reasoning_tokens are not added: the published schedule has no separate
# reasoning price, and the headless total already treats output_tokens as the
# output bill.
# Grok Build names grok-4.7 sessions grok-4.7-build. The harness prices that
# suffix at the base model's list rate.

