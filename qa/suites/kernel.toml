# 13. Forall certificate (document): filtered SQL/Python generator with OR/NOT
# ---------------------------------------------------------------------------

[[group]]
id = "forall-doc-generator"
kind = "document"
path = "generators/high_value_customer/run.py"
tags = ["synthetic", "forall"]
body = """
# Generates out.csv of high-value customers for downstream checks.
# TODO: restrict to enterprise tier once tier column is backfilled.
import csv

QUERY = '''
SELECT c.id AS customer_id, 'high_value_customer' AS classification
FROM customers c
WHERE c.id IN ('Acme', 'Globex', 'Initech')
  AND c.suspended = FALSE
  AND (c.lifetime_sales_usd > 25000000 OR c.active_seats > 1000)
'''

def run(conn):
    rows = conn.execute(QUERY).fetchall()
    with open("out.csv", "w", newline="") as f:
        writer = csv.writer(f)
        writer.writerow(["customer_id", "classification"])
        writer.writerows(rows)
"""

[[group.probes]]
id = "forall-doc-is-customer"
proposition = "For all c, if out.csv supports that c is a high-value customer, then c is a customer."
expected = "entailed"
tags = ["plain", "positive"]

[[group.probes]]
id = "forall-doc-not-suspended"
