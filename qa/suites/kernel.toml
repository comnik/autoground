# 9. Joint witness (synthetic): two-file flag -> mode -> action synthesis
# ---------------------------------------------------------------------------

[[group]]
id = "joint-synthetic-flags"
kind = "joint"
tags = ["synthetic"]
files = [
  { path = "cli.rs", body = """
pub enum Mode { Halt, Continue, Defer }

pub fn parse_mode(flag: &str) -> Option<Mode> {
    match flag {
        "--strict" => Some(Mode::Halt),
        "--lenient" => Some(Mode::Continue),
        "--queue" => Some(Mode::Defer),
        _ => None,
    }
}
""" },
  { path = "runner.rs", body = """
use crate::cli::Mode;

pub fn handle_warning(mode: Mode) -> &'static str {
    match mode {
        Mode::Halt => "abort_run",
        Mode::Continue => "log_and_proceed",
        Mode::Defer => "enqueue_retry",
    }
}
""" },
]

[[group.probes]]
id = "joint-flag-strict"
