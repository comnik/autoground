# Self-contained proof-kernel probe suite for `qa oracle`.
#
# Each [[group]] shares one oracle state (batched into a single Jev POST).
# Probes test all four oracle question shapes (`document`, `part`, `joint`,
# `implication`) across contrastive roles (`entailed`, `contradicted`,
# `closed-world`, `irrelevant`), metamorphic invariants (`negation_of`,
# `paraphrase_of`), and sense-templated role assignments (`sense`, `role-swap`).

# ---------------------------------------------------------------------------
# 1. Single document: src/value.rs (Kleene three-valued logic)
# ---------------------------------------------------------------------------

[[group]]
id = "doc-value"
kind = "document"
path = "src/value.rs"
tags = ["repo"]

[[group.probes]]
id = "value-and-false-unknown"
template = "`Value::{op}` with `{lhs}` and `{rhs}` returns `{result}`"
roles = { op = "and", lhs = "False", rhs = "Unknown", result = "False" }
expected = "entailed"
tags = ["sense", "positive"]

[[group.probes]]
id = "value-and-false-unknown-para"
proposition = "Calling `Value::False.and(Value::Unknown)` evaluates to `Value::False`."
expected = "entailed"
paraphrase_of = "value-and-false-unknown"
tags = ["plain", "positive", "paraphrase"]

[[group.probes]]
id = "value-and-false-unknown-neg"
template = "`Value::{op}` with `{lhs}` and `{rhs}` returns `{result}`"
roles = { op = "and", lhs = "False", rhs = "Unknown", result = "Unknown" }
expected = "contradicted"
negation_of = "value-and-false-unknown"
tags = ["sense", "adversarial", "negation"]

[[group.probes]]
id = "value-or-true-unknown"
template = "`Value::{op}` with `{lhs}` and `{rhs}` returns `{result}`"
roles = { op = "or", lhs = "True", rhs = "Unknown", result = "True" }
expected = "entailed"
tags = ["sense", "positive"]

[[group.probes]]
id = "value-or-false-unknown-bad"
template = "`Value::{op}` with `{lhs}` and `{rhs}` returns `{result}`"
roles = { op = "or", lhs = "False", rhs = "Unknown", result = "False" }
expected = "contradicted"
tags = ["sense", "adversarial"]

[[group.probes]]
id = "value-not-unknown"
proposition = "Negating `Value::Unknown` with `Value::not` returns `Value::Unknown`."
expected = "entailed"
tags = ["plain", "positive"]

[[group.probes]]
id = "value-not-unknown-neg"
proposition = "Negating `Value::Unknown` with `Value::not` returns `Value::False`."
expected = "contradicted"
negation_of = "value-not-unknown"
tags = ["plain", "adversarial", "negation"]

[[group.probes]]
id = "value-closed-world-support"
proposition = "The confidence trust bar `SUPPORT` is `0.85`."
expected = "neutral"
tags = ["plain", "closed-world"]

[[group.probes]]
id = "value-irrelevant-retries"
proposition = "HTTP 429 responses are retried up to 4 times with exponential backoff."
expected = "neutral"
tags = ["plain", "irrelevant"]

