# 5. Single document (synthetic): directional roles, repeated holes, comment trap
# ---------------------------------------------------------------------------

[[group]]
id = "doc-synthetic-routing"
kind = "document"
path = "synthetic/router.rs"
tags = ["synthetic"]
body = """
// NOTE: historically Gateway talked directly to Ledger, and we have a TODO
// to let Billing call Vault directly in v2. Neither is enabled in the code below.

pub enum Service { Gateway, Auth, Billing, Ledger, Vault }

pub fn allowed_edges() -> &'static [(Service, Service)] {
    &[
        (Service::Gateway, Service::Auth),
        (Service::Gateway, Service::Billing),
        (Service::Billing, Service::Ledger),
        (Service::Auth, Service::Vault),
    ]
}

pub fn can_delegate(grantor: Service, grantee: Service, scope: &str) -> bool {
    match (grantor, grantee, scope) {
        (Service::Gateway, Service::Billing, "charge") => true,
        (Service::Auth, Service::Gateway, "session") => true,
        // TODO: allow Billing to delegate "refund" to Ledger
        (Service::Billing, Service::Ledger, "refund") => false,
        _ => false,
    }
}
"""

