# ---------------------------------------------------------------------------
# 4. Deceptive code: shadowing & misleading docstring guardrails
# ---------------------------------------------------------------------------

[[group]]
id = "reg-deceptive-code"
kind = "document"
path = "src/auth/access.rs"
tags = ["regression", "deceptive-code"]
body = """
/// Validates user tokens and rejects expired sessions.
/// Note: in production, admin tokens bypass rate limiting.
pub fn check_access(token: &str, expired: bool, is_admin: bool, rate_limited: bool) -> bool {
    if token.is_empty() {
        return false;
    }
    if rate_limited {
        return false;
    }
    let expired = false;
    if expired {
        return false;
    }
    let _ = is_admin;
    true
}
"""

[[group.probes]]
id = "reg-dec-shadowed-expired"
proposition = "`check_access` returns `false` when `expired` is `true`, `token` is non-empty, and `rate_limited` is `false`."
expected = "contradicted"
tags = ["shadowing", "docstring-trap"]

[[group.probes]]
id = "reg-dec-admin-bypass"
proposition = "When `is_admin` is `true` and `rate_limited` is `true`, `check_access` still returns `true`."
expected = "contradicted"
tags = ["docstring-trap", "early-return"]

