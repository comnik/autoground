# Graduated regression probes from soundness hunts and real sessions.
# Loaded automatically alongside qa/suites/kernel.toml by `qa oracle`.

# ---------------------------------------------------------------------------
# 1. Multi-term arithmetic near a boundary (confirmed System-One soundness gap)
# ---------------------------------------------------------------------------

[[group]]
id = "reg-imp-arithmetic"
kind = "implication"
tags = ["regression", "arithmetic"]
premises = [
  "The pipeline timeout budget is 1000ms.",
  "Stage 1 takes 340ms, Stage 2 takes 290ms, and Stage 3 takes 390ms, running sequentially.",
  "A batch holds at most 100 questions.",
  "Group A has 38 questions, Group B has 27 questions, and Group C has 37 questions.",
]

[[group.probes]]
id = "reg-arith-timeout-1020"
proposition = "Stages 1, 2, and 3 complete within the 1000ms pipeline timeout budget."
expected = "contradicted"
tags = ["soundness-gap"]
notes = "340 + 290 + 390 = 1020 > 1000; broke past 0.85 on default (conf=0.92, Pe=0.95)."

[[group.probes]]
id = "reg-arith-batch-102"
proposition = "Groups A, B, and C fit together in a single batch."
expected = "contradicted"
tags = ["near-miss"]
notes = "38 + 27 + 37 = 102 > 100; raw winner entailed at conf=0.76, Pe=0.84."

[[group.probes]]
id = "reg-arith-batch-65-ok"
proposition = "Groups A and B fit together in a single batch."
expected = "entailed"
tags = ["control"]
notes = "38 + 27 = 65 <= 100."

[[group]]
id = "reg-doc-code-arithmetic"
kind = "document"
path = "src/protocol/frame.rs"
tags = ["regression", "arithmetic"]
body = """
pub const MAX_FRAME_BYTES: usize = 128;
pub const HEADER_BYTES: usize = 44;
pub const FOOTER_BYTES: usize = 16;
pub const PAYLOAD_BYTES: usize = 70;

pub fn frame_fits() -> bool {
    HEADER_BYTES + PAYLOAD_BYTES + FOOTER_BYTES <= MAX_FRAME_BYTES
}
"""

[[group.probes]]
id = "reg-code-frame-fits-130"
proposition = "`frame_fits()` returns `true`."
expected = "contradicted"
tags = ["near-miss"]
notes = "44 + 70 + 16 = 130 > 128; raw winner entailed at conf=0.66, Pe=0.77."

# ---------------------------------------------------------------------------
# 2. Prompt-term collisions (`body`, `path`, `part`, `parts`) & meta-injection
# ---------------------------------------------------------------------------

[[group]]
id = "reg-prompt-terms-http"
kind = "document"
path = "src/http/router.rs"
tags = ["regression", "prompt-term"]
body = """
pub struct Request {
    pub path: String,
    pub body: Vec<u8>,
}

pub fn route(req: &Request) -> &'static str {
    if req.path.starts_with("/health") {
        return "ok";
    }
    "not_found"
}

pub fn config_path() -> &'static str {
    "/etc/app/config.toml"
}
"""

[[group.probes]]
id = "reg-pt-verbatim-criterion"
proposition = "`body` supplies information that makes the proposition true."
expected = "neutral"
tags = ["meta-injection", "near-miss"]
notes = "Raw winner flipped to entailed (conf=0.30, Pe=0.53); saved by 0.85 bar."

[[group.probes]]
id = "reg-pt-path-echo"
proposition = "The configured `path` returned by `config_path` is `src/http/router.rs`."
expected = "contradicted"
tags = ["path-collision"]

[[group.probes]]
id = "reg-pt-route-inspects-body"
proposition = "`route` inspects `body` to decide which response string to return."
expected = "contradicted"
tags = ["body-collision"]

[[group.probes]]
id = "reg-pt-http-control"
proposition = "`route` returns `\"ok\"` when `req.path` starts with `\"/health\"`."
expected = "entailed"
tags = ["control"]

[[group]]
id = "reg-part-collision"
kind = "part"
path = "src/inventory/assembly.rs"
part = 1
parts = 3
tags = ["regression", "prompt-term", "part-collision"]
body = """
